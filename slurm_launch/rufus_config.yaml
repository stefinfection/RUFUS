# Global defaults (apply to all profiles unless overridden)
inputs:
  subject_file: "path_to/your_subject.cram"
  paired_control_files: []                # array; leave empty if using prebuilt hashes
  reference_fasta: "path_to/GRCh38.fa"

algorithm:
  kmer_length: 25
  kmer_depth_cutoff: 5
  other_flags: "-L -vs"

working_dir: "."                          # where rufus writes outputs
threads_per_job: 40
no_kg1_removal: false                     # if true, keep variants in 1000G (overrides kg1 settings)
use_prebuilt_control: true                # if false, must provide paired_control_files

# Prebuilt hashes
prebuilt:
  control:
    control_hash_version: "v1.0"         # default version when fetching
    control_hash_local_dir: ""           # set only if using local prebuilt control hashes
  kg1:
    kg1_hash_version: "v3.0"
    kg1_hash_local_dir: ""               # set only if using local KG1 hashes

# Specialized profiles
profiles:
  default:
    description: "Runs rufus in whole-genome mode on a single machine"
    mode: "whole_genome"

  default_windowed: &default_windowed
    description: "Runs rufus in 1MB windowed-mode. Requires region file."
    window:
      window_size: 1000
      region_file: "path_to/region_file.txt"
    threads_per_job: 10
    prebuilt:
      control:
        control_hash_version: "v1.0"
      kg1:
        kg1_hash_version: "v3.0"

# TODO: left off removing Marth_windowed and put in slurm windowed instead
  marth_windowed:
    description: "For use on Marth lab machines"
    <<: *default_windowed
    mode: "region"                                   # explicit mode
    inputs:
      reference_fasta: "/path/to/DAC/ref/GRCh38.fa"  # override example
    tools:
      container_type: "singularity"
      resource_mgmt: "slurm"
    resources:
      slurm:
        nodes: 6
        account: "marth-rw"
        partition: "marth-rw"
        time: "01-00:00:00"
        job_name: "rufus"
        email: "your_unid@utah.edu"
    container:
      singularity_image: "/path/to/rufus.sif"
    prebuilt:
      control:
        control_hash_local_dir: "/path/to/prebuilt/control/v1.0"  # optional local override
      kg1:
        kg1_hash_local_dir: "/path/to/prebuilt/kg1/v3.0"

  # EC2 oriented: windowed + docker + GNU parallel
  ec2_windowed:
    <<: *default_windowed
    description: "For DAC use on EC2"
    mode: "region"
    tools:
      container_type: "docker"
      resource_mgmt: "parallel"
    container:
      docker_image: "path_to/stefinfection/rufus:latest"

  # (future) default_whole_genome profile can be added here